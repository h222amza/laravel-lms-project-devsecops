
name: LMS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend-build:
    name: Frontend Production Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: LMS-frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: LMS-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: CI=false npm run build

  backend-tests:
    name: Backend Laravel Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: LMSbackend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, xml, ctype, iconv, pdo_sqlite, sqlite3, fileinfo, curl, dom
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Prepare test environment
        run: |
          cp .env.example .env
          php artisan key:generate
          mkdir -p database
          touch database/database.sqlite

      - name: Run Laravel tests
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
        run: php artisan test

  push-to-ecr:
    name: Build and Push Images to Amazon ECR
    runs-on: ubuntu-latest
    needs: [frontend-build, backend-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      id-token: write

    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      ECR_BACKEND_REPOSITORY: ${{ vars.ECR_BACKEND_REPOSITORY }}
      ECR_FRONTEND_REPOSITORY: ${{ vars.ECR_FRONTEND_REPOSITORY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate AWS configuration
        run: |
          test -n "$AWS_REGION" || (echo "AWS_REGION is missing" && exit 1)
          test -n "$AWS_ROLE_ARN" || (echo "AWS_ROLE_ARN is missing" && exit 1)
          test -n "$ECR_BACKEND_REPOSITORY" || (echo "ECR_BACKEND_REPOSITORY is missing" && exit 1)
          test -n "$ECR_FRONTEND_REPOSITORY" || (echo "ECR_FRONTEND_REPOSITORY is missing" && exit 1)
      
      - name: Debug GitHub OIDC claims
        uses: actions/github-script@v7
        with:
          script: |
            core.info(`Repository: ${context.repo.owner}/${context.repo.repo}`);
            core.info(`Ref: ${context.ref}`);
            core.info(`Event: ${context.eventName}`);


      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            --file LMSbackend/Dockerfile \
            --tag "$REGISTRY/$ECR_BACKEND_REPOSITORY:$IMAGE_TAG" \
            LMSbackend
          docker push "$REGISTRY/$ECR_BACKEND_REPOSITORY:$IMAGE_TAG"

      - name: Build and push frontend image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            --file LMS-frontend/Dockerfile \
            --tag "$REGISTRY/$ECR_FRONTEND_REPOSITORY:$IMAGE_TAG" \
            LMS-frontend
          docker push "$REGISTRY/$ECR_FRONTEND_REPOSITORY:$IMAGE_TAG"

