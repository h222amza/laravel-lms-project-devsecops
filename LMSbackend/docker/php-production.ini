
; Hide PHP version information.
expose_php = Off

; Avoid showing errors to users; send them to logs.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /proc/self/fd/2

; Avoid treating arbitrary path information as a PHP script.
cgi.fix_pathinfo = 0

; Upload limits: keep these consistent with Nginx.
upload_max_filesize = 50M
post_max_size = 55M
max_execution_time = 60

; Production OPcache settings.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
opcache.save_comments = 1
