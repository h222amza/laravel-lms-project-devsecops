server {
    listen 8080;
    server_name _;
    root /var/www/html/public;
    index index.php;

    # Reduce version disclosure.
    server_tokens off;

    # Request body limit. Adjust if LMS uploads need more.
    client_max_body_size 22m;

    # Compress text-based responses.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml
        application/rss+xml
        image/svg+xml;

    # Basic security headers.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Laravel routes.
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Long-lived caching for Vite build assets.
    # Vite-generated asset names are normally versioned.
    location ^~ /build/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;

        # Repeat security headers because add_header inheritance changes
        # when a location defines its own add_header directives.
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;

        access_log off;
    }

    # Execute only Laravel's front controller.
    location = /index.php {
        include fastcgi_params;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
    }

    # Do not execute any other PHP file from the public directory.
    location ~ \.php$ {
        return 404;
    }

    # Deny hidden files, except ACME/.well-known paths.
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
